name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Generate Android scaffold (android/ is not stored in the repo)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org app.discover --project-name discover_personality /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Prepare release signing (only if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KS_PASS" > android/key.properties
            echo "Release keystore prepared."
          else
            echo "No signing secrets: APK will be signed with the debug key."
          fi

      - name: Patch AndroidManifest (INTERNET, label, Start.io entries)
        env:
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
        run: python3 tool/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: Format check (non-blocking, see docs/BUILD_APK.md)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=AI_PROXY_URL="$AI_PROXY_URL" \
            --dart-define=ADS_ENABLED=false \
            --dart-define=STARTIO_TEST_MODE=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discover-personality-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release (direct .apk download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
