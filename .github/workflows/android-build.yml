name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Generate Android scaffold (android/ is not stored in the repo)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org app.discover --project-name discover_personality /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Prepare release signing (only if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KS_PASS" > android/key.properties
            echo "Release keystore prepared."
          else
            echo "::error::Missing secrets ANDROID_KEYSTORE_BASE64 and/or ANDROID_KEYSTORE_PASSWORD. Without them every build gets a different debug signature and Android refuses to update the installed app."
            exit 1
          fi

      - name: Prepare Firebase config (optional, enables push notifications)
        env:
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_JSON_B64" ]; then
            echo "$GS_JSON_B64" | base64 -d > android/app/google-services.json
            echo "google-services.json prepared."
          else
            echo "No Firebase secret: push notifications will be unavailable in this build."
          fi

      - name: Patch AndroidManifest (INTERNET, label, Start.io entries)
        env:
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
        run: python3 tool/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: Format code (applies dart format inside the runner only)
        run: dart format lib test

      - name: Apply safe lint fixes (inside the runner only)
        continue-on-error: true
        run: dart fix --apply lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Release checklist warnings
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
          STARTIO_TEST_MODE: ${{ vars.STARTIO_TEST_MODE || 'true' }}
        run: |
          [ -z "$CONTACT_EMAIL" ] && echo "::warning::Repository variable CONTACT_EMAIL is not set: the privacy policy will show a placeholder e-mail (Google Play rejects that)."
          [ -z "$STARTIO_APP_ID" ] && echo "::warning::Secret STARTIO_APP_ID is not set: the default Start.io App ID from tool/patch_android.py is used."
          [ "$STARTIO_TEST_MODE" = "true" ] && echo "::warning::STARTIO_TEST_MODE=true: only TEST ads are shown. Set repository variable STARTIO_TEST_MODE=false for the Play Store release."
          exit 0

      - name: Build release APK and AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
          ADS_ENABLED: ${{ vars.ADS_ENABLED || 'true' }}
          STARTIO_TEST_MODE: ${{ vars.STARTIO_TEST_MODE || 'true' }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          DEFINES=(
            --build-name=1.0.${{ github.run_number }}
            --build-number=${{ github.run_number }}
            --dart-define=SUPABASE_URL="$SUPABASE_URL"
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
            --dart-define=AI_PROXY_URL="$AI_PROXY_URL"
            --dart-define=ADS_ENABLED="$ADS_ENABLED"
            --dart-define=STARTIO_TEST_MODE="$STARTIO_TEST_MODE"
            --dart-define=CONTACT_EMAIL="$CONTACT_EMAIL"
          )
          flutter build apk --release "${DEFINES[@]}"
          flutter build appbundle --release "${DEFINES[@]}"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: discover-personality-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Publish APK + AAB as a GitHub Release (direct download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }} (v1.0.${{ github.run_number }})"
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          prerelease: true
