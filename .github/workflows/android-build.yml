name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true

      - name: Generate Android scaffold (android/ is not stored in the repo)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org app.discover --project-name discover_personality /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Prepare release signing (only if secrets are set)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KS_PASS" > android/key.properties
            echo "Release keystore prepared."
          else
            echo "::error::Missing secrets ANDROID_KEYSTORE_BASE64 and/or ANDROID_KEYSTORE_PASSWORD. Without them every build gets a different debug signature and Android refuses to update the installed app."
            exit 1
          fi

      - name: Prepare Firebase config (optional, enables push notifications)
        env:
          GS_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS_JSON_B64" ]; then
            echo "$GS_JSON_B64" | base64 -d > android/app/google-services.json
            echo "google-services.json prepared."
          else
            echo "No Firebase secret: push notifications will be unavailable in this build."
          fi

      - name: Patch AndroidManifest (INTERNET, label, Start.io entries)
        env:
          STARTIO_APP_ID: ${{ secrets.STARTIO_APP_ID }}
        run: python3 tool/patch_android.py

      - name: Verify patched Gradle values (fails the build if a value did not apply)
        run: |
          f=android/app/build.gradle; [ -f "$f" ] || f=android/app/build.gradle.kts
          grep -nE "compileSdk|targetSdk|minSdk|signingConfig" "$f"
          grep -qE "targetSdk(Version)?\s*=?\s*36" "$f" || { echo "::error::targetSdk is not 36 in $f"; exit 1; }
          grep -qE "compileSdk(Version)?\s*=?\s*36" "$f" || { echo "::error::compileSdk is not 36 in $f"; exit 1; }
          grep -qE 'signingConfigs\.release|getByName\("release"\)' "$f" || { echo "::error::release signing is not configured in $f"; exit 1; }

      - name: Release readiness warning (placeholders)
        run: |
          if grep -q "ADD_CONTACT_EMAIL_BEFORE_PUBLISHING" lib/core/config.dart; then
            echo "::warning::Contact e-mail is still a placeholder. Run: python3 store/fill_placeholders.py --email ... --name ... before a Play release."
          fi

      - name: Install packages
        run: flutter pub get

      - name: Format code (applies dart format inside the runner only)
        run: dart format lib test

      - name: Apply safe lint fixes (inside the runner only)
        continue-on-error: true
        run: dart fix --apply lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=AI_PROXY_URL="$AI_PROXY_URL" \
            --dart-define=ADS_ENABLED=false \
            --dart-define=STARTIO_TEST_MODE=true

      - name: Verify 16 KB page-size support (Google Play requirement for targetSdk 35+)
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -c -P 16 4 "$apk" && echo "zip alignment (16 KB) OK" || echo "::warning::zipalign -P 16 reported a problem"
          rm -rf /tmp/apk16 && mkdir -p /tmp/apk16
          unzip -q -o "$apk" 'lib/arm64-v8a/*.so' 'lib/x86_64/*.so' -d /tmp/apk16 || true
          fail=0
          for f in /tmp/apk16/lib/*/*.so; do
            [ -e "$f" ] || continue
            for a in $(readelf -lW "$f" | awk '/ LOAD / {print $NF}' | sort -u); do
              if [ $((a)) -lt 16384 ]; then
                echo "::error::$(echo "$f" | sed 's|/tmp/apk16/||') has LOAD alignment $a (< 16 KB)"
                fail=1
              fi
            done
          done
          [ "$fail" = 0 ] && echo "All native libraries are 16 KB aligned." || exit 1

      - name: Build release AAB (the format Google Play requires)
        env:
          # Release 1 on Google Play is local-only: Supabase is NOT compiled in (no accounts, chat or sync) unless the
          # repository variable PLAY_ENABLE_SOCIAL is set to "true" (Settings > Secrets and variables > Actions > Variables).
          PLAY_SOCIAL: ${{ vars.PLAY_ENABLE_SOCIAL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
        run: |
          if [ "$PLAY_SOCIAL" = "true" ]; then
            echo "::warning::PLAY_ENABLE_SOCIAL=true: this bundle includes accounts, chat and sync (privacy policy, Data safety and UGC rules must cover them)."
            DEFS="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY --dart-define=AI_PROXY_URL=$AI_PROXY_URL"
          else
            echo "Local-only Play bundle (no Supabase, no AI proxy)."
            DEFS=""
          fi
          flutter build appbundle --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            $DEFS \
            --dart-define=ADS_ENABLED=false \
            --dart-define=STARTIO_TEST_MODE=true

      - name: Print merged manifest permissions (Data safety / Advertising ID review)
        continue-on-error: true
        run: |
          m=$(find build/app/intermediates -path "*merged_manifests*" -path "*elease*" -name AndroidManifest.xml | head -1)
          echo "merged manifest: $m"
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$m" | sed 's/.*android:name=//' | sort -u

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: discover-personality-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discover-personality-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release (direct .apk download, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }} (v1.0.${{ github.run_number }})"
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
